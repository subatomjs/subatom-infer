name: Publish Package to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version is already published
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          # Fetch published version from npm registry
          PUBLISHED_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "none")
          
          echo "Current version in repo: $CURRENT_VERSION"
          echo "Latest version on npm:   $PUBLISHED_VERSION"
          
          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "Version has not changed. Skipping publish."
          fi

      - name: Install dependencies
        if: steps.check_version.outputs.is_new_version == 'true'
        run: npm ci

      - name: Lint
        if: steps.check_version.outputs.is_new_version == 'true'
        run: npm run lint

      # Triggers prepublishOnly (typecheck -> build -> test) and publishes
      - name: Publish to npm
        if: steps.check_version.outputs.is_new_version == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}